<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Pugile in guardia, illustrazione in stile cartone">
  <!-- Boxer in stile cartone: illustrazione originale, non una persona reale -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46546b"/>
      <stop offset="1" stop-color="#2e3745"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="185" r="150" fill="url(#ring)" opacity="0.55"/>
  <circle cx="160" cy="185" r="150" fill="none" stroke="#6ea8e1" stroke-width="3" opacity="0.5"/>
  <!-- gambe -->
  <rect x="128" y="252" width="26" height="72" rx="12" fill="#e8b78d"/>
  <rect x="168" y="252" width="26" height="72" rx="12" fill="#e8b78d"/>
  <!-- scarpe -->
  <rect x="120" y="312" width="42" height="20" rx="9" fill="#26313f"/>
  <rect x="162" y="312" width="42" height="20" rx="9" fill="#26313f"/>
  <!-- pantaloncini -->
  <path d="M118 218 h86 v18 q0 10 -10 10 h-8 l-6 -14 h-38 l-6 14 h-8 q-10 0 -10 -10 z" fill="#3f6ea6"/>
  <rect x="118" y="214" width="86" height="10" rx="5" fill="#8fbef0"/>
  <!-- torso -->
  <path d="M116 140 q44 -22 88 0 l-4 78 q-40 12 -80 0 z" fill="#f0c49a"/>
  <!-- fascia petto -->
  <path d="M116 140 q44 -22 88 0 l-1 12 q-43 -20 -86 0 z" fill="#3f6ea6"/>
  <!-- braccio sinistro (guardia alta) -->
  <path d="M122 148 q-30 -6 -40 -34" stroke="#f0c49a" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="104" r="24" fill="#6ea8e1"/>
  <circle cx="84" cy="104" r="24" fill="none" stroke="#3f6ea6" stroke-width="4"/>
  <!-- braccio destro (guardia mento) -->
  <path d="M198 148 q26 -2 30 -30" stroke="#f0c49a" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="230" cy="110" r="24" fill="#6ea8e1"/>
  <circle cx="230" cy="110" r="24" fill="none" stroke="#3f6ea6" stroke-width="4"/>
  <!-- testa -->
  <circle cx="160" cy="96" r="34" fill="#f0c49a"/>
  <!-- capelli a spazzola -->
  <path d="M126 82 q0 -22 34 -22 t34 22 l-4 -6 h-60 z" fill="#e8c95a"/>
  <rect x="126" y="60" width="68" height="14" rx="6" fill="#e8c95a"/>
  <!-- viso -->
  <circle cx="148" cy="96" r="3.4" fill="#26313f"/>
  <circle cx="172" cy="96" r="3.4" fill="#26313f"/>
  <path d="M150 112 q10 7 20 0" stroke="#26313f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- orecchie -->
  <circle cx="126" cy="98" r="6" fill="#e8b78d"/>
  <circle cx="194" cy="98" r="6" fill="#e8b78d"/>
  <!-- sudore cartoon -->
  <path d="M108 62 q-6 10 0 16 q8 -4 0 -16" fill="#8fbef0"/>
  <path d="M216 60 q-6 10 0 16 q8 -4 0 -16" fill="#8fbef0"/>
</svg>
