<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF scheda sessione | Nicola</title>

<meta name="robots" content="noindex, nofollow">

<script>(function(){var p=location.pathname,i=p.indexOf("/admin/"),b=i>0?p.slice(0,i):/^\/nicola(\/|$)/i.test(p)?"/nicola":"";window.FQ_BASE=b;window.fqUrl=function(u){if(!u)return b||"/";if(u.charAt(0)!=="/")u="/"+u;return b+u;};if(b&&!document.querySelector("base[data-fq-base]")){var e=document.createElement("base");e.href=b+"/";e.setAttribute("data-fq-base","1");document.head.insertBefore(e,document.head.firstChild);}})();</script>

<link rel="stylesheet" href="css/styles.css?v=2">

<link rel="stylesheet" href="admin/css/admin-pdf-sessione.css?v=2">

</head>

<body class="admin-pdf-page">

<div class="admin-pdf-toolbar no-print">

  <div class="admin-pdf-toolbar__inner wrap">

    <p><strong>Scheda sessione · PDF stampabile</strong></p>

    <div class="btn-row">

      <button type="button" class="btn btn-primary" id="pdf-print-btn">Stampa / Salva PDF</button>

      <a class="btn btn-ghost" id="pdf-back-link" href="./">← Ciclo</a>

      <a class="btn btn-ghost" id="pdf-fase-link" href="admin/prototipi/periodizzazione/fase/?anno=2026-2027&fase=ipertrofia-accumulo">PDF settimana AB–CB</a>

    </div>

    <p class="admin-pdf-toolbar__tip"><small>Stampa in <strong>verticale (A4)</strong> · margini <strong>8 mm</strong> · max 2 facciate · figure grandi · sidebar log</small></p>

  </div>

</div>



<main id="pdf-root"><p style="text-align:center;padding:2rem">Caricamento PDF…</p></main>



<script>

(function () {

  var p = new URLSearchParams(location.search);

  var back = document.getElementById("pdf-back-link");

  if (back && p.get("ciclo")) {

    var href = "admin/sessione/?ciclo=" + encodeURIComponent(p.get("ciclo")) + "&sessione=" + (p.get("sessione") || "ab");

    back.href = window.fqUrl ? window.fqUrl("/admin/sessione/?ciclo=" + encodeURIComponent(p.get("ciclo")) + "&sessione=" + (p.get("sessione") || "ab")) : href;

    back.textContent = "← Scheda online";

  }

  var faseLink = document.getElementById("pdf-fase-link");

  if (faseLink && p.get("ciclo")) {

    var fh = "admin/prototipi/periodizzazione/fase/?anno=2026-2027&fase=" + encodeURIComponent(p.get("ciclo"));

    faseLink.href = window.fqUrl ? window.fqUrl("/admin/prototipi/periodizzazione/fase/?anno=2026-2027&fase=" + encodeURIComponent(p.get("ciclo"))) : fh;

  }

})();

</script>

<script src="admin/js/sprite-esercizi.js?v=1" defer></script>

<script src="admin/js/sessione-pdf.js?v=2" defer></script>

</body>

</html>
